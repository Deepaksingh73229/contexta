[project]
name = "contexta-enterprise"
version = "3.0.0"
description = "Contexta — Fully offline enterprise RAG backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi[standard]>=0.129.0",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.22",
    "aiofiles>=25.1.0",

    # ── LLM (local Ollama) ─────────────────────────────────────────────────────
    "ollama>=0.4.0",

    # ── Document parsing ───────────────────────────────────────────────────────
    "pymupdf4llm>=1.27.2.2",
    "pypdf>=6.7.5",
    "langchain-text-splitters>=1.1.1",

    # ── Embeddings + FAISS (enterprise additions) ──────────────────────────────
    "sentence-transformers>=3.0.0",   # offline embedding + cross-encoder rerank
    "faiss-cpu>=1.8.0",               # FAISS vector index (CPU-only, no GPU required)
    "numpy>=1.26.0",

    # ── BM25 keyword scoring ───────────────────────────────────────────────────
    # Using built-in _BM25 implementation (no extra dep needed).
    # Optionally: "rank-bm25>=0.2.2"

    # ── Validation ────────────────────────────────────────────────────────────
    "pydantic>=2.0.0",
]