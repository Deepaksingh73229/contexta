[project]
name = "contexta-enterprise"
version = "3.1.0"
description = "Contexta — Fully offline enterprise RAG backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi[standard]>=0.129.0",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.22",
    "aiofiles>=25.1.0",

    # ── LLM (local Ollama) ─────────────────────────────────────────────────────
    "ollama>=0.4.0",

    # ── Document parsing ───────────────────────────────────────────────────────
    "pymupdf4llm>=1.27.2.2",
    "pypdf>=6.7.5",
    "langchain-text-splitters>=1.1.1",

    # ── Embeddings + FAISS + cross-encoder ────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",

    # ── Validation ────────────────────────────────────────────────────────────
    "pydantic>=2.0.0",
]